name: ✅ Валидация RetroAOSP (линтер патчей, ~2 минуты)

# Полная сборка ROM на бесплатных раннерах GitHub невозможна физически:
# лимит джобы 6 часов при реальном времени сборки 15-30 ч на 4 vCPU,
# и ~80 ГБ диска при потребности ~250 ГБ. Собираем локально (build_local.sh),
# а CI лишь гарантирует, что патчи валидны и апстрим lineage-21 не «уехал».

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # еженедельно: ловим изменения апстрима

jobs:
  validate:
    name: 🔍 Линтер патчей и проверка апстрима
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 🧪 Локальный тестовый стенд (синтаксис, XML, ассеты, mock-прогон)
        run: bash tests/run_all_tests.sh

      - name: 🌐 Проверка веток манифеста (repo существуют и ветки на месте)
        run: |
          set -e
          check() { git ls-remote --heads "https://github.com/$1.git" "refs/heads/$2" | grep -q . \
                    && echo "OK  $1 @ $2" || { echo "FAIL $1 @ $2"; exit 1; }; }
          check LineageOS/android lineage-22.2
          check LineageOS/android_device_xiaomi_onclite lineage-22.2
          check LineageOS/android_kernel_xiaomi_onclite lineage-22.2
          check LineageOS/android_hardware_xiaomi lineage-22.2
          check TheMuppets/proprietary_vendor_xiaomi_onclite lineage-22.2

      - name: 🎯 Проверка целей Java-патчей в живом lineage-22.2
        run: |
          set -e
          B="https://raw.githubusercontent.com/LineageOS/android_frameworks_base/lineage-22.2"
          T="https://raw.githubusercontent.com/LineageOS/android_packages_apps_Trebuchet/lineage-22.2"
          fetch_grep() { curl -fsSL "$1" | grep -qF "$2" \
                         && echo "OK  $3" || { echo "FAIL $3 — цель патча исчезла из апстрима!"; exit 1; }; }
          fetch_grep "$B/graphics/java/android/graphics/drawable/RippleDrawable.java" \
                     "FORCE_PATTERNED_STYLE = true;" "RippleDrawable"
          fetch_grep "$B/packages/SystemUI/src/com/android/systemui/statusbar/phone/ClockController.java" \
                     "STATUS_BAR_CLOCK, CLOCK_POSITION_LEFT)" "ClockController"
          fetch_grep "$T/src/com/android/launcher3/config/FeatureFlags.java" \
                     '"ENABLE_ALL_APPS_BUTTON_IN_HOTSEAT", DISABLED,' "Trebuchet FeatureFlags"
          fetch_grep "$B/packages/SystemUI/res/values/flags.xml" \
                     'name="flag_monet"' "SystemUI flag_monet"
