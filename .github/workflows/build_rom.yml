name: 🚀 Облачная сборка RetroAOSP (Redmi 7 / onclite)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки (userdebug / eng / user)'
        required: true
        default: 'userdebug'
      sync_clean:
        description: 'Чистая синхронизация repo sync'
        required: false
        default: 'true'

jobs:
  build:
    name: 🛠️ Сборка RetroAOSP для Redmi 7 (onclite)
    runs-on: ubuntu-22.04
    
    steps:
      - name: 📥 Проверка нашего репозитория RetroAOSP
        uses: actions/checkout@v4
        with:
          path: retro_project

      - name: 🧹 Максимизация дискового пространства на облачном сервере
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: ⚙️ Установка сборочного тулчейна и зависимостей Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "RetroAOSP Bot"
          git config --global user.email "bot@retroaosp.local"

      - name: 📦 Инициализация исходного кода Android (LineageOS 21/23 Base)
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-21 --git-lfs --depth=1

      - name: 📋 Подключение локального манифеста для Redmi 7 (onclite)
        run: |
          mkdir -p ~/rom/.repo/local_manifests
          cp -v retro_project/local_manifests/onclite.xml ~/rom/.repo/local_manifests/onclite.xml

      - name: 🔄 Синхронизация исходного кода и деревьев устройства (repo sync)
        run: |
          cd ~/rom
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: 🎨 Наложение ретро-патчей Material Design 1 (Android 7 UI)
        run: |
          cd ~/rom
          bash $GITHUB_WORKSPACE/retro_project/retro_ui_patches/apply_retro_patches.sh

      - name: 🗑️ Очистка git-метаданных (.repo) для освобождения +30 ГБ диска
        run: |
          echo "💥 Удаление папки ~/rom/.repo перед старта компиляции для предотвращения No space left on device..."
          rm -rf ~/rom/.repo
          df -h

      - name: ⚡ Компиляция прошивки (mka bacon)
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_onclite-${{ github.event.inputs.build_type }}
          mka bacon -j$(nproc --all)

      - name: 📤 Загрузка готового ZIP-архива прошивки на GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RetroAOSP-onclite-ROM
          path: ~/rom/out/target/product/onclite/*-onclite-*.zip
          retention-days: 7
